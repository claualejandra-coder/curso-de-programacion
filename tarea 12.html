<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tabla avanzada</title>
    <link rel="stylesheet" href="tarea.css">
</head>

<body>

    <table>
        <thead>
            <tr>
                <th rowspan="2">Región</th>
                <th colspan="2">Ventas del Año</th>
                <th rowspan="2">Total</th>
            </tr>
            <tr>
                <th>Semestre 1</th>
                <th>Semestre 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Norte</td>
                <td>$10,000</td>
                <td>$12,000</td>
                <td rowspan="2">$45,000</td>
            </tr>
            <tr>
                <td>$11,000</td>
                <td>$12,000</td>
            </tr>
            <tr>
                <td>Sur</td>
                <td>$8,000</td>
                <td>$9,000</td>
                <td>$17,000</td>
            </tr>
            <tr>
                <td>Este</td>
                <td>$15,000</td>
                <td>$14,000</td>
                <td>$29,000</td>
            </tr>
            <tr>
                <td colspan="3"><strong>Total definitivo</strong></td>
                <td><strong>$91,000</strong></td>
            </tr>
        </tbody>
    </table>

</body>

</html>
